name: Rebuild site from CMS content

# Decap CMS commits content JSON to admin/content/. The static site's HTML is
# generated from that content by tools/build.mjs, so this workflow runs the
# build and commits the regenerated files. That is what makes a CMS edit show
# up on the live site without anyone running a build locally.
#
# The push below uses the default GITHUB_TOKEN, and GitHub does not start new
# workflow runs from GITHUB_TOKEN pushes, so this cannot loop.
on:
  push:
    branches: [main]
    paths:
      - 'admin/content/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the site
        run: node tools/build.mjs

      - name: Check internal links
        run: node tools/check-links.mjs

      - name: Commit regenerated files
        run: |
          git config user.name "presscosmos-bot"
          git config user.email "presscosmos-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — the site is already up to date."
          else
            git commit -m "Rebuild site from content [skip ci]"
            git push
          fi
